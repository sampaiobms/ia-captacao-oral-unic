name: Sync Cadastros Pacientes (Oral Unic)

on:
  schedule:
    # 07:00 e 17:00 no horário de Brasília (UTC-3) = 10:00 e 20:00 UTC.
    # Ajuste se a clínica mudar de fuso ou quiser outros horários.
    - cron: '0 10,20 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar sincronização
        env:
          ORAL_UNIC_USER: ${{ secrets.ORAL_UNIC_USER }}
          ORAL_UNIC_PASS: ${{ secrets.ORAL_UNIC_PASS }}
          SYNC_FUNCTION_URL: ${{ secrets.SYNC_FUNCTION_URL }}
          ROBO_SYNC_SECRET: ${{ secrets.ROBO_SYNC_SECRET }}
          STOCK_SYNC_FUNCTION_URL: ${{ secrets.STOCK_SYNC_FUNCTION_URL }}
          STOCK_ROBO_SYNC_SECRET: ${{ secrets.STOCK_ROBO_SYNC_SECRET }}
        run: npm run sync

      - name: Salvar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robo-debug-${{ github.run_id }}
          path: downloads/
          retention-days: 14
